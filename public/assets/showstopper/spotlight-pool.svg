<?xml version="1.0" encoding="UTF-8"?>
<!-- spotlight-pool.svg — warm candlelit pool of light.
     Drop behind the hero plate and reuse as the per-section spotlight that follows scroll.
     Fully transparent at the edges so it composites with `screen`/`lighten` over --char.
     cx/cy can be driven by scroll or cursor; keep static under reduced-motion. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960">
  <defs>
    <radialGradient id="pool" cx="50%" cy="40%" r="62%">
      <stop offset="0%"  stop-color="#FCE7C2" stop-opacity="0.58"/>
      <stop offset="22%" stop-color="#E8B968" stop-opacity="0.30"/>
      <stop offset="46%" stop-color="#C9A24B" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#7A3A1E" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#161210" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="40%" r="26%">
      <stop offset="0%"  stop-color="#FFF3DC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFF3DC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="960" fill="url(#pool)"/>
  <rect width="1280" height="960" fill="url(#core)"/>
</svg>

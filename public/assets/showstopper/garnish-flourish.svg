<?xml version="1.0" encoding="UTF-8"?>
<!-- garnish-flourish.svg — calligraphic brass swash for the hero (sweeps in after the headline plates, Stage 2)
     and as a section divider accent. Single stroke path so it can be "drawn" with stroke-dasharray
     (pathLength=100 → animate stroke-dashoffset 100→0). A small leaf/sprig sits on the tail. -->
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" role="img" aria-label="Decorative garnish flourish">
  <defs>
    <linearGradient id="swash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9B7A33" stop-opacity="0"/>
      <stop offset="14%"  stop-color="#C9A24B"/>
      <stop offset="50%"  stop-color="#EAD18A"/>
      <stop offset="86%"  stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#9B7A33" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- main swash -->
  <path pathLength="100"
        d="M14 70 C 70 28, 150 24, 196 56 C 230 80, 250 80, 284 56 C 330 24, 410 28, 466 70"
        fill="none" stroke="url(#swash)" stroke-width="3" stroke-linecap="round"/>

  <!-- under-swash hairline echo -->
  <path d="M70 86 C 150 62, 330 62, 410 86" fill="none" stroke="#C9A24B" stroke-width="1" opacity="0.45" stroke-linecap="round"/>

  <!-- centre sprig: two small leaves + bud -->
  <g fill="#EAD18A">
    <path d="M240 50 Q 232 34 240 22 Q 248 34 240 50 Z"/>
    <path d="M240 50 Q 226 44 218 50 Q 230 56 240 50 Z" opacity="0.85"/>
    <path d="M240 50 Q 254 44 262 50 Q 250 56 240 50 Z" opacity="0.85"/>
    <circle cx="240" cy="20" r="3"/>
  </g>
</svg>

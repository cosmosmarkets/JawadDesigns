<?xml version="1.0" encoding="UTF-8"?>
<!-- deckled-edge.svg — torn/feathered paper edge for the Menu card (Stage 4) so it reads as printed stock, not a div.
     Use as a CSS mask (mask-image) or border slice along a card edge. Repeat horizontally.
     Irregular fractal-displaced edge gives the hand-deckled look. -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="24" viewBox="0 0 200 24" preserveAspectRatio="none">
  <defs>
    <filter id="deckle" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.9" numOctaves="2" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- the paper body; its bottom edge is roughened by the displacement filter -->
  <path filter="url(#deckle)" d="M0 0 H200 V15 H0 Z" fill="#efe1c9"/>
</svg>

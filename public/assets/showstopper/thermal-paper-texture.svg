<?xml version="1.0" encoding="UTF-8"?>
<!-- thermal-paper-texture.svg — receipt stock for the printing order ticket (Stage 5).
     Cool off-white with faint horizontal feed banding + low speckle, so monospace ink reads as printed.
     Tileable vertically (the ticket "feeds" down). Keep the curl-shadow as a separate CSS layer. -->
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox" spreadMethod="repeat">
      <stop offset="0"    stop-color="#f7f6f2" stop-opacity="1"/>
      <stop offset="0.5"  stop-color="#eeedea" stop-opacity="1"/>
      <stop offset="1"    stop-color="#f7f6f2" stop-opacity="1"/>
    </linearGradient>
    <filter id="tspeck" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55 0.62" numOctaves="2" seed="9" stitchTiles="stitch" result="s"/>
      <feColorMatrix in="s" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045" intercept="-0.008"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="360" height="360" fill="#f4f2ec"/>
  <rect width="360" height="360" fill="url(#band)" opacity="0.5"/>
  <rect width="360" height="360" filter="url(#tspeck)"/>
</svg>

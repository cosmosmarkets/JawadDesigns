<?xml version="1.0" encoding="UTF-8"?>
<!-- perforation-edge.svg — torn/perforated top edge for the thermal ticket (Stage 5).
     Repeat horizontally (background-repeat: repeat-x) along the ticket's top.
     Two layers: a zig-zag torn silhouette (mask the paper to it) + punched perforation dots.
     Recolour the fills to match the thermal stock; here they carry the receipt off-white. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="20" viewBox="0 0 48 20">
  <!-- torn silhouette: triangles biting into the top edge -->
  <path d="M0 20 V8 L6 14 L12 6 L18 13 L24 5 L30 13 L36 6 L42 14 L48 8 V20 Z" fill="#f4f2ec"/>
  <!-- perforation holes just below the tear line -->
  <g fill="#161210" opacity="0.5">
    <circle cx="6"  cy="17" r="1.1"/>
    <circle cx="18" cy="17" r="1.1"/>
    <circle cx="30" cy="17" r="1.1"/>
    <circle cx="42" cy="17" r="1.1"/>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- film-grain.svg — tileable monochrome film grain.
     Use as a fixed full-bleed overlay at 3–5% opacity, mix-blend-mode: overlay/soft-light.
     stitchTiles="stitch" makes it repeat seamlessly via background-repeat.
     Animate `seed` (or translate a slightly larger tile) for live grain; static under reduced-motion. -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="1.1" intercept="-0.04"/>
    </feComponentTransfer>
  </filter>
  <rect width="320" height="320" filter="url(#grain)"/>
</svg>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jawad Design — I serve websites</title>
  <meta name="description" content="I design and build portfolio sites and landing pages — beautiful, fast, and made to convert. A one-chef studio, made to order, shipped in five days." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161210'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='6' fill='none' stroke='%23C9A24B' stroke-width='1'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='20' fill='%23F4E7D6'%3EJ%3C/text%3E%3C/svg%3E" />
  <meta property="og:title" content="Jawad Design — I serve websites" />
  <meta property="og:image" content="brand/og-image.png" />

  <meta name="ext-resource-dependency" content="brand/jawad-design-lockup.png" data-resource-id="lockup" />
  <meta name="ext-resource-dependency" content="brand/chef-hat.png" data-resource-id="hat" />
  <meta name="ext-resource-dependency" content="images/weld.png" data-resource-id="weld" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,500;1,6..96,600&family=Cinzel:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Pinyon+Script&family=Bebas+Neue&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="k3-tokens.css" />
  <link rel="stylesheet" href="k3-sections.css" />
  <link rel="stylesheet" href="k3-pass3.css" />
  <link rel="stylesheet" href="k3-pass4-material.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Motion stack (Stage 0 foundation): GSAP + ScrollTrigger + SplitText + CustomEase + Lenis -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
  <script src="k3-motion.js"></script>
  <script src="k3-atmos.js"></script>
</head>
<body data-motion="on">
  <template id="__bundler_thumbnail" data-bg-color="#161210">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#161210"/>
      <text x="600" y="430" text-anchor="middle" font-family="Bebas Neue, Anton, sans-serif" font-size="300" fill="#F4E7D6" letter-spacing="4">JD</text>
      <rect x="585" y="500" width="34" height="34" transform="rotate(45 602 517)" fill="#D2462F"/>
    </svg>
  </template>
  <div id="root"></div>

  <!-- Stage 1 cinematic atmosphere: vignette + warm candlelight pool + film grain.
       Fixed, non-interactive, sits above section content but below nav/docket/modal. -->
  <div id="jd-atmos" aria-hidden="true">
    <div class="jd-atmos__vign"></div>
    <div class="jd-atmos__spot"></div>
    <div class="jd-atmos__grain"></div>
  </div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="k3-home.jsx"></script>

  <script type="text/babel">
    const { useTweaks, TweaksPanel, TweakSection, TweakColor, TweakRadio, TweakSelect } = window;

    const HEADLINES = {
      "Bodoni Moda": '"Bodoni Moda", Georgia, serif',
      "Cinzel": '"Cinzel", Georgia, serif',
      "Bricolage Grotesque": '"Bricolage Grotesque", system-ui, sans-serif',
      "Fraunces": '"Fraunces", Georgia, serif',
    };
    // [ember, brass, gold]
    const PALETTES = {
      "Ember (house)":  ["#D2462F", "#C9A24B", "#EAD18A"],
      "Claret":         ["#B23A48", "#C9A24B", "#E7CE8E"],
      "Saffron sear":   ["#E0552B", "#CFA94E", "#F0D58C"],
      "Forest & brass": ["#3E7A4F", "#C9A24B", "#E7CE8E"],
    };

    const DEFAULTS = /*EDITMODE-BEGIN*/{
      "headline": '"Bodoni Moda", Georgia, serif',
      "palette": ["#D2462F","#C9A24B","#EAD18A"],
      "motion": "on",
      "grain": "on",
      "spotlight": "medium",
      "contrast": "medium"
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(DEFAULTS);
      React.useEffect(() => {
        const r = document.documentElement;
        r.style.setProperty('--headline', t.headline);
        const [ember, brass, gold] = t.palette;
        r.style.setProperty('--ember', ember);
        r.style.setProperty('--ember-deep', shade(ember, -0.28));
        r.style.setProperty('--ember-glow', hexa(ember, 0.45));
        r.style.setProperty('--brass', brass);
        r.style.setProperty('--brass-soft', shade(brass, 0.28));
        r.style.setProperty('--gold', gold);
        document.body.dataset.motion = t.motion;
        // Stage 1 atmosphere
        document.body.dataset.grain = t.grain;
        document.body.dataset.atmos = t.spotlight;
        document.body.dataset.contrast = t.contrast;
        // unified off-switch: re-evaluate Lenis + scroll tweens whenever the tweak changes
        if (window.JDMotion) window.JDMotion.apply();
      }, [t]);

      return (
        <>
          <window.K3Home />
          <TweaksPanel title="Fine-dining tweaks">
            <TweakSection label="Type" />
            <TweakSelect label="Headline font"
              value={t.headline}
              options={Object.entries(HEADLINES).map(([label, value]) => ({ label, value }))}
              onChange={(v) => setTweak('headline', v)} />
            <TweakSection label="Palette" />
            <TweakColor label="Accent" value={t.palette} options={Object.values(PALETTES)} onChange={(v) => setTweak('palette', v)} />
            <TweakSection label="Motion" />
            <TweakRadio label="Scroll & haze" value={t.motion} options={['on', 'off']} onChange={(v) => setTweak('motion', v)} />
            <TweakSection label="Atmosphere" />
            <TweakRadio label="Film grain" value={t.grain} options={['on', 'off']} onChange={(v) => setTweak('grain', v)} />
            <TweakRadio label="Spotlight" value={t.spotlight} options={['subtle', 'medium', 'pronounced']} onChange={(v) => setTweak('spotlight', v)} />
            <TweakRadio label="Contrast" value={t.contrast} options={['subtle', 'medium', 'dramatic']} onChange={(v) => setTweak('contrast', v)} />
          </TweaksPanel>
        </>
      );
    }

    function hex(h){return h.replace('#','').match(/.{2}/g).map(x=>parseInt(x,16));}
    function mix(a,b,amt){const pa=hex(a),pb=hex(b);return '#'+pa.map((c,i)=>Math.round(c*(1-amt)+pb[i]*amt).toString(16).padStart(2,'0')).join('');}
    function shade(h,amt){return mix(h, amt<0?'#000000':'#ffffff', Math.abs(amt));}
    function hexa(h,a){const [r,g,b]=hex(h);return `rgba(${r},${g},${b},${a})`;}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
